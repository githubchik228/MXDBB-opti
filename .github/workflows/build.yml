name: Build MXDBB Opti
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: src\build.cmd
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MXDBB-Opti
          path: |\n            src/release/**\n            src/MXDBB Opti.exe
